spring:
  datasource:
    url: jdbc:h2:mem:identitydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

auth:
  jwt-issuer: cloudmedia-test
  jwt-secret: test-secret-key-test-secret-key-test-secret-key
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  max-active-sessions: 5
  social-token-verifier-mode: fake
