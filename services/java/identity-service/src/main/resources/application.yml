spring:
  application:
    name: identity-service
  jpa:
    open-in-view: false

auth:
  jwt-issuer: cloudmedia-identity
  jwt-secret: change-me-in-production-change-me-in-production
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  max-active-sessions: 5
  social-token-verifier-mode: fake

server:
  port: 8081
