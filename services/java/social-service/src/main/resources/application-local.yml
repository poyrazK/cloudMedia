spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/cloudmedia_social
    username: ${POSTGRES_USER:cloudmedia}
    password: ${POSTGRES_PASSWORD:localdev}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
